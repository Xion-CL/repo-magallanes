<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repositorio Magallanes - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Pantalla de Carga -->
    <div id="loading-screen">
        <div class="loader-container">
            <div class="leaf-loader">
                <i class="fas fa-leaf"></i>
            </div>
            <h2 class="mt-3">Repositorio Magallanes</h2>
            <p class="loading-text">Conectando con la red de distribución...</p>
            <div class="progress-bar-container">
                <div class="progress-bar"></div>
            </div>
        </div>
    </div>

    <!-- Login -->
    <div id="login-container" class="d-none">
        <div class="login-wrapper">
            <div class="login-box">
                <div class="text-center mb-4">
                    <div class="logo-circle mb-3">
                        <i class="fas fa-seedling"></i>
                    </div>
                    <h2 class="fw-bold">Repositorio Magallanes</h2>
                    <p class="text-muted">Plataforma de Trazabilidad y Distribución de Alimentos</p>
                </div>
                
                <form id="loginForm">
                    <div class="form-group mb-3">
                        <label class="form-label"><i class="fas fa-envelope me-2"></i>Correo Electrónico</label>
                        <input type="email" class="form-control" placeholder="usuario@magallanes.cl" value="admin@repositorio.cl">
                    </div>
                    
                    <div class="form-group mb-4">
                        <label class="form-label"><i class="fas fa-lock me-2"></i>Contraseña</label>
                        <input type="password" class="form-control" placeholder="••••••••" value="123456">
                    </div>
                    
                    <button type="submit" class="btn btn-login w-100 mb-3">
                        <i class="fas fa-sign-in-alt me-2"></i>Ingresar al Sistema
                    </button>
                    
                    <div class="text-center">
                        <small class="text-muted">¿Problemas para acceder? <a href="#" class="text-success">Contactar soporte</a></small>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Animación de carga
        window.addEventListener('load', () => {
            const progressBar = document.querySelector('.progress-bar');
            let width = 0;
            const interval = setInterval(() => {
                if (width >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        document.getElementById('loading-screen').classList.add('fade-out');
                        setTimeout(() => {
                            document.getElementById('loading-screen').style.display = 'none';
                            document.getElementById('login-container').classList.remove('d-none');
                            document.getElementById('login-container').classList.add('fade-in');
                        }, 500);
                    }, 500);
                } else {
                    width += 2;
                    progressBar.style.width = width + '%';
                }
            }, 30);
        });

        // Login
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
